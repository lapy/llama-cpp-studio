name: Upstream anchor drift

# Transform assets patch fork-owned text (installer prologues, dependency
# subsets, version pins). When a fork edits that text the asset no longer
# applies and the user's install fails with a TransformError. This audit
# applies every asset to the forks' current default branches, so drift is
# reported here (weekly) instead of during an install. It is separate from CI
# because it depends on the forks' live contents, not on this repository.
on:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Apply every transform asset to the forks' current sources
        env:
          STUDIO_UPSTREAM_ANCHORS: "1"
        run: python -m pytest backend/tests/test_engine_upstream_anchors.py -q --tb=short
