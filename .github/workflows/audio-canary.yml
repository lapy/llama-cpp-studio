name: audio.cpp latest release canary

# The canary tracks upstream audio.cpp, not this repository's diff. It is
# intentionally schedule/dispatch-only: while a known upstream break is
# outstanding (v0.9.4/v0.9.5 prebuilts require GLIBC_2.43; ubuntu:24.04 ships
# 2.39) every merge must not inherit a red workflow. The scheduled run is the
# loud signal, and its JSON artifact says exactly which contract assumption
# failed.
on:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-cpp-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Canary the latest audio.cpp release against the composed contract
        run: python scripts/audio-cpp-canary.py --report audio-cpp-canary-report.json

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-cpp-canary-report
          path: audio-cpp-canary-report.json
          if-no-files-found: warn
          retention-days: 30
