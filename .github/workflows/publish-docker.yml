name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: llama-cpp-studio

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip-audit -r requirements.lock
          ruff check backend scripts
          ruff format --check backend/config_history.py backend/routes/benchmarks.py backend/routes/config_history.py backend/services/model_benchmark.py backend/tests/test_config_history.py backend/tests/test_model_benchmark.py backend/tests/test_operation_state_machine.py backend/version.py scripts/check-version.py scripts/export-openapi.py
          python scripts/check-version.py
          python scripts/export-openapi.py --check
          python -m pytest backend/tests -q --tb=short

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Require Node 24
        run: node -e 'const major=process.versions.node.split(".")[0]; if (major!=="24") { console.error("Node "+process.versions.node+" is not 24"); process.exit(1) }'
      - name: Install and test
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint:frontend
          npm run typecheck:api
          npm run style:check
          npm run format:check
          npm run test:frontend
      - name: Skip production build on forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: |
          echo "Fork pull request: production build skipped because the license secret is unavailable"
      - name: Production frontend build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          VITE_PRIMEUI_LICENSE: ${{ secrets.VITE_PRIMEUI_LICENSE }}
        run: |
          if [ -z "${VITE_PRIMEUI_LICENSE:-}" ]; then
            echo "VITE_PRIMEUI_LICENSE is required for the production build"
            exit 1
          fi
          npm run build
          node frontend/e2e/cold-models-budget.mjs

  build:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Skip image build on forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: |
          echo "Fork pull request: image build, smoke, and push skipped because the license secret is unavailable"

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.created_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            VITE_PRIMEUI_LICENSE=${{ secrets.VITE_PRIMEUI_LICENSE }}

      - name: Resolve the locally built image
        id: local-image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$image"
          mkdir -p artifacts/container-validation
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Smoke the built image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          STUDIO_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/container-validation
        run: |
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$IMAGE"
          scripts/container-smoke.sh "$IMAGE"

      - name: Set up Node for navigation measurement
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install the navigation measurement browser
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Measure production navigation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          STUDIO_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/container-validation
        run: |
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$IMAGE"
          scripts/measure-production-navigation.sh "$IMAGE"

      - name: Scan the tested image for high-severity vulnerabilities
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.local-image.outputs.name }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate the tested image SBOM
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.local-image.outputs.name }}
          format: cyclonedx-json
          output-file: artifacts/container-validation/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Push the smoked image
        id: push
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          primary=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
            if [ -z "$primary" ]; then
              primary="$tag"
            fi
          done <<< "$IMAGE_TAGS"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$primary")"
          digest="${digest##*@}"
          case "$digest" in
            sha256:*) ;;
            *) echo "registry manifest digest was not recorded for $primary" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/container-validation
          echo "registry_digest=$digest" >> artifacts/container-validation/image-identity.txt

      - name: Upload container validation evidence
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: actions/upload-artifact@v6
        with:
          name: container-validation
          path: artifacts/container-validation
          if-no-files-found: warn

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          show-summary: true
