[unix_http_server]
file=/state/supervisor.sock
chmod=0700
chown=agent:agent

[supervisord]
logfile=/state/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/state/supervisord.pid
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///state/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/state/logs/sshd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:backend]
command=/usr/local/bin/studio-run-backend
user=agent
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/state/logs/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:frontend]
command=/usr/local/bin/studio-run-frontend
user=agent
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/state/logs/frontend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
