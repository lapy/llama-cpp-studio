[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launchcraft-fixture"
version = "0.1.0"
description = "Hermetic launch fixture for the YAML launch campaign (tests only)"
requires-python = ">=3.9"

[project.scripts]
launchcraft-server = "launchcraft_fixture.server:main"

[tool.setuptools]
packages = ["launchcraft_fixture"]
