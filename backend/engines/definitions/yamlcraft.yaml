# AUTHORITATIVE engine definition (hand-authored; NOT exported).
#
# `yamlcraft` is the YAML-onboarding campaign's FIXTURE engine
# (docs/yaml-engine-onboarding-campaign.md): it exists to prove the
# control plane end to end — startup tier check, registry registration,
# generic lifecycle, data-driven install — with ZERO Python. It is
# intentionally NOT a real inference backend: runtime_kind/scanner_kind
# reuse existing vocabulary strings for schema conformance ONLY; nothing
# launches it (launch proof is the separate runtime/discovery campaign).
# The architecture guard (test_engine_definitions_fixture.py) fails the
# build if the literal string "yamlcraft" ever appears outside this file,
# tests, and docs.
schema_version: 2
id: yamlcraft
# Repository metadata: this persona exists only for the end-to-end harnesses,
# so the production registry bootstrap must not register it.
fixture_only: true
label: Crafty
repository_source: yamlcraft
install_kind: python_venv
runtime_kind: llama_server
scanner_kind: llama_help
active_path_fields:
- venv_path
# Deliberately claims NO artifact format served by real model code, so the
# fixture never leaks into safetensors/gguf compatibility inference or the
# model catalog (a control-plane fixture must not answer model questions).
artifact_formats:
- fixture_only
package_kinds:
- hf_snapshot
tasks:
- text-generation
- embeddings
input_modalities:
- text
output_modalities:
- text
- embedding
lifecycle:
  update_source:
    kind: pypi
    package: yamlcraft-fixture
  binary_name: yamlcraft
  distribution_names:
  - yamlcraft-fixture
  root_name: yamlcraft
  default_repo_url: https://github.com/example-org/yamlcraft.git
  default_branch: main
  version_setting_key: pip_version
  status_fallback:
    installed_at: null
    removed_at: null
    log_path: null
recipes:
  release:
  - id: resolve_version
    uses: prereqs.resolve_version
    produces:
    - version
  - id: create_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: install_package
    uses: pip.install_package
    requires:
    - venv
    - version
    - input.force_reinstall
    with:
      package: yamlcraft-fixture
      version_from: version
      stage: install
      error: pip exited with status {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: publish
    uses: publish.install
    requires:
    - venv
    - metadata
  source:
  - id: ensure_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: fetch_source
    uses: vcs.workspace_checkout
    requires:
    - input.engine_root
    - input.repo_url
    - input.branch
    - input.reuse_mode
    with:
      repository_from: input.repo_url
      branch_from: input.branch
      reuse_from: input.reuse_mode
    produces:
    - checkout
  - id: install_editable
    uses: pip.install_package
    requires:
    - checkout
    - venv
    with:
      package: .
      editable: true
      stage: install_source
      cwd_from: checkout
      error: pip install -e -v . failed with code {code}
  - id: seal_checkout
    uses: vcs.seal_checkout
    requires:
    - checkout
    - venv
    when:
      equals:
        field: input.reuse_mode
        value: false
    produces:
    - checkout_sealed
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: publish
    uses: publish.install
    requires:
    - venv
    - metadata
    with:
      variant: source
  sync:
  - id: ensure_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: sync_checkout
    uses: vcs.sync
    requires:
    - input.engine_root
    - input.branch
    with:
      branch_from: input.branch
    produces:
    - checkout
  - id: reinstall_editable
    uses: pip.install_package
    requires:
    - checkout
    - venv
    with:
      package: .
      editable: true
      stage: sync_source
      append: true
      cwd_from: checkout
      error: pip install -e -v . failed with code {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: record_update
    uses: publish.record_update
    requires:
    - checkout
    - metadata
    - input.version_name
    with:
      source_repo_from: input.source_repo
  remove:
  - id: uninstall_package
    uses: pip.uninstall
    requires:
    - input.engine_root
    when:
      equals:
        field: input.venv_python_exists
        value: true
    with:
      package: yamlcraft-fixture
      stage: remove
  - id: remove_venv_tree
    uses: fs.remove_tree
    requires:
    - input.venv_path
    - input.retire_references
    with:
      path_from: input.venv_path
      retire_references_from: input.retire_references
  - id: forget_install
    uses: publish.forget
    requires:
    - input.version_name
