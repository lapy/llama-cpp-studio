# AUTHORITATIVE engine definition (hand-authored; NOT exported).
#
# Strata (Niko1221/Strata) is a local inference engine for consumer NVIDIA,
# AMD, Intel Arc and Apple Silicon GPUs. Its Terminal (the `strata` command)
# distributes a per-backend engine package, prepares a model run config
# (`strata-<model>.json`) and supervises the OpenAI/Anthropic server from that
# config. Studio therefore sees a STRATA PROFILE as the model artifact, not a
# raw GGUF file: the GGUF shards are input to the Terminal's preparation step.
#
# Status: registration only. The engine identity, artifact/package contract and
# hardware policy are declared here so the catalogue, model compatibility and
# UI filters use one source of truth. Studio does not yet install the Terminal
# or supervise `strata serve`: that needs a dedicated native host (install from
# the signed release feed, profile preparation, foreground server ownership)
# and is tracked separately. There is deliberately no `lifecycle`, `recipes` or
# `runtime_profiles` block until that host lands; declaring a partial install
# path here would advertise actions Studio cannot perform.
schema_version: 2
id: strata
extends:
- text_generation_tasks
label: Strata
ui_kind: native
repository_source: Strata
install_kind: prebuilt
runtime_kind: strata
scanner_kind: llama_help
active_path_fields:
- binary_path
artifact_formats:
- prepared_bundle
package_kinds:
- prepared_bundle
input_modalities:
- image
- text
output_modalities:
- text
experimental: true
maturity_surfaces:
  nvidia_consumer: experimental
  amd_consumer: experimental
  apple_silicon: experimental
launch_policy:
  cpu_supported: false
  gpu_archs:
  - sm86
  - sm89
  - sm120
  - gfx1100
  - gfx1101
  - gfx1200
  - gfx1201
  - gfx1151
  runtime_context_key: context_length
upstream:
  repository_url: https://github.com/Niko1221/Strata.git
settings_defaults:
  source_repo: https://github.com/Niko1221/Strata.git
  source_branch: main
data_dirs:
- strata
