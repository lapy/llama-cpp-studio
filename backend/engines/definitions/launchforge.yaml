# AUTHORITATIVE engine definition (hand-authored; NOT exported).
#
# `launchforge` is the launch campaign's SECOND fixture persona (review
# follow-up: "prove a second, materially different engine configuration").
# It is deliberately unlike the first one in every dimension that the
# compiler can get wrong:
#
# * artifact_formats claims `gguf`, so the engine JOINS the derived
#   GGUF_ENGINE_IDS at startup. Before the dispatch fix that membership
#   silently routed it into the legacy GGUF compiler; now a definition-
#   backed engine is profile-launched from this file instead. This is the
#   onboarding case the `fixture_only` persona could not cover.
# * executable is a venv PYTHON with a module prefix (`-m ...`) rather than
#   a console script;
# * model_binding is POSITIONAL (the model is an argv token, not a flag);
# * env.cwd is `venv_root` and a required variable is satisfied by an
#   engine default (validation runs against the FINAL launch environment).
#
# Installed from the same hermetic local wheel as the first persona
# (dist `launchcraft-fixture`), so no network is involved.
schema_version: 2
id: launchforge
# Repository metadata: this persona exists only for the end-to-end harnesses,
# so the production registry bootstrap must not register it.
fixture_only: true
label: Launchforge
repository_source: launchforge-fixture
install_kind: python_venv
runtime_kind: llama_server
scanner_kind: llama_help
active_path_fields:
- venv_path
artifact_formats:
- gguf
package_kinds:
- hf_snapshot
tasks:
- text-generation
input_modalities:
- text
output_modalities:
- text
lifecycle:
  update_source:
    kind: pypi
    package: launchcraft-fixture
  binary_name: launchcraft-server
  distribution_names:
  - launchcraft-fixture
  root_name: launchforge
  default_repo_url: https://github.com/example-org/launchforge.git
  default_branch: main
  version_setting_key: pip_version
  status_fallback:
    installed_at: null
    removed_at: null
    log_path: null
settings_defaults:
  pip_version: ""
discovery:
  parser: llama_help
  probe_argv_prefix:
  - -m
  - launchcraft_fixture.server
  - --scan-help
runtime_profiles:
  default:
    default: true
    description: Launchforge module-style fixture server (positional model, venv python)
    executable:
      kind: venv_python
    argv_prefix:
    - -m
    - launchcraft_fixture.server
    model_binding:
      mode: positional
      source: huggingface_id
    port_binding:
      flag: --port
    env:
      required:
      - LAUNCHFORGE_MODE
      defaults:
        LAUNCHFORGE_MODE: fixture
      cwd: venv_root
      prepend_bin_to_path: true
recipes:
  release:
  - id: resolve_version
    uses: prereqs.resolve_version
    produces:
    - version
  - id: create_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: install_package
    uses: pip.install_package
    requires:
    - venv
    - version
    - input.force_reinstall
    with:
      package: launchcraft-fixture
      version_from: version
      stage: install
      error: pip exited with status {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: publish
    uses: publish.install
    requires:
    - venv
    - metadata
  source:
  - id: ensure_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: fetch_source
    uses: vcs.workspace_checkout
    requires:
    - input.engine_root
    - input.repo_url
    - input.branch
    - input.reuse_mode
    with:
      repository_from: input.repo_url
      branch_from: input.branch
      reuse_from: input.reuse_mode
    produces:
    - checkout
  - id: install_editable
    uses: pip.install_package
    requires:
    - checkout
    - venv
    with:
      package: .
      editable: true
      stage: install_source
      cwd_from: checkout
      error: pip install -e -v . failed with code {code}
  - id: seal_checkout
    uses: vcs.seal_checkout
    requires:
    - checkout
    - venv
    when:
      equals:
        field: input.reuse_mode
        value: false
    produces:
    - checkout_sealed
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: publish
    uses: publish.install
    requires:
    - venv
    - metadata
    with:
      variant: source
  sync:
  - id: ensure_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: sync_checkout
    uses: vcs.sync
    requires:
    - input.engine_root
    - input.branch
    with:
      branch_from: input.branch
    produces:
    - checkout
  - id: reinstall_editable
    uses: pip.install_package
    requires:
    - checkout
    - venv
    with:
      package: .
      editable: true
      stage: sync_source
      append: true
      cwd_from: checkout
      error: pip install -e -v . failed with code {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: record_update
    uses: publish.record_update
    requires:
    - checkout
    - metadata
    - input.version_name
    with:
      source_repo_from: input.source_repo
  remove:
  - id: uninstall_package
    uses: pip.uninstall
    requires:
    - input.engine_root
    when:
      equals:
        field: input.venv_python_exists
        value: true
    with:
      package: launchcraft-fixture
      stage: remove
  - id: remove_venv_tree
    uses: fs.remove_tree
    requires:
    - input.venv_path
    - input.retire_references
    with:
      path_from: input.venv_path
      retire_references_from: input.retire_references
  - id: forget_install
    uses: publish.forget
    requires:
    - input.version_name
