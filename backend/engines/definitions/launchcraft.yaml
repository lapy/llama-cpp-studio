# AUTHORITATIVE engine definition (hand-authored; NOT exported).
#
# `launchcraft` is the LAUNCH campaign's fixture engine
# (docs/yaml-engine-launch-campaign.md, owner decision Q1): a SECOND
# fixture persona, kept separate so the shipped control-plane fixture's
# YAML and every pin around it stay byte-identical. This one exists to
# prove one thing end to end: a YAML-only engine can be INSTALLED,
# ACTIVATED and ACTUALLY LAUNCHED as a real server process through
# Studio's native proxy, with its argv coming from THIS FILE alone
# (runtime_profiles), and serve /health + /v1/chat.
#
# It is intentionally NOT a real inference backend:
# * artifact_formats claims only `fixture_only` — it must never join the
#   GGUF/derived launch sets or model-compatibility inference (a
#   `gguf`-declaring YAML engine would be silently routed into the
#   legacy GGUF compiler; see docs/yaml-engine-launch-campaign.md §1);
# * the package `launchcraft-fixture` exists only in the repo's test
#   fixtures and is installed from a hand-built local wheel — a real
#   install attempt fails honestly.
schema_version: 2
id: launchcraft
# Repository metadata: this persona exists only for the end-to-end harnesses,
# so the production registry bootstrap must not register it.
fixture_only: true
label: Launchcraft
repository_source: launchcraft-fixture
install_kind: python_venv
runtime_kind: llama_server
scanner_kind: llama_help
active_path_fields:
- venv_path
artifact_formats:
- fixture_only
package_kinds:
- hf_snapshot
tasks:
- text-generation
input_modalities:
- text
output_modalities:
- text
lifecycle:
  update_source:
    kind: pypi
    package: launchcraft-fixture
  binary_name: launchcraft-server
  distribution_names:
  - launchcraft-fixture
  root_name: launchcraft
  default_repo_url: https://github.com/example-org/launchcraft.git
  default_branch: main
  version_setting_key: pip_version
  status_fallback:
    installed_at: null
    removed_at: null
    log_path: null
settings_defaults:
  pip_version: ""
# WIRED discovery (not decorative): scanner.scan_engine_version reads this
# block for definition-backed engines and runs the profile executable with
# probe_argv_prefix, parsing with the existing parser named here.
# `--scan-help` is deliberately NOT the conventional `--help`: the scan can
# only succeed if the declared prefix is actually used, so the wiring is
# proven by the journey, not assumed.
discovery:
  parser: llama_help
  probe_argv_prefix:
  - --scan-help
runtime_profiles:
  # The ENTIRE launch contract of this file: executable kind + model/port
  # bindings. backend/proxy/profile_launch.py compiles it into the same
  # typed LaunchSpec the nine legacy compilers emit; argv is pinned in
  # backend/tests/test_launchcraft_journey.py by reading the argv the OS
  # actually passed (GET /__state), not by trusting the compiler.
  default:
    default: true
    description: Launchcraft stdlib fixture server (OpenAI-compatible, deterministic)
    executable:
      kind: venv_console_script
      name: launchcraft-server
    model_binding:
      mode: flag
      flag: --model
      source: huggingface_id
    port_binding:
      flag: --port
    env:
      prepend_bin_to_path: true
recipes:
  release:
  - id: resolve_version
    uses: prereqs.resolve_version
    produces:
    - version
  - id: create_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: install_package
    uses: pip.install_package
    requires:
    - venv
    - version
    - input.force_reinstall
    with:
      package: launchcraft-fixture
      version_from: version
      stage: install
      error: pip exited with status {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: publish
    uses: publish.install
    requires:
    - venv
    - metadata
  source:
  - id: ensure_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: fetch_source
    uses: vcs.workspace_checkout
    requires:
    - input.engine_root
    - input.repo_url
    - input.branch
    - input.reuse_mode
    with:
      repository_from: input.repo_url
      branch_from: input.branch
      reuse_from: input.reuse_mode
    produces:
    - checkout
  - id: install_editable
    uses: pip.install_package
    requires:
    - checkout
    - venv
    with:
      package: .
      editable: true
      stage: install_source
      cwd_from: checkout
      error: pip install -e -v . failed with code {code}
  - id: seal_checkout
    uses: vcs.seal_checkout
    requires:
    - checkout
    - venv
    when:
      equals:
        field: input.reuse_mode
        value: false
    produces:
    - checkout_sealed
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: publish
    uses: publish.install
    requires:
    - venv
    - metadata
    with:
      variant: source
  sync:
  - id: ensure_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: sync_checkout
    uses: vcs.sync
    requires:
    - input.engine_root
    - input.branch
    with:
      branch_from: input.branch
    produces:
    - checkout
  - id: reinstall_editable
    uses: pip.install_package
    requires:
    - checkout
    - venv
    with:
      package: .
      editable: true
      stage: sync_source
      append: true
      cwd_from: checkout
      error: pip install -e -v . failed with code {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: record_update
    uses: publish.record_update
    requires:
    - checkout
    - metadata
    - input.version_name
    with:
      source_repo_from: input.source_repo
  remove:
  - id: uninstall_package
    uses: pip.uninstall
    requires:
    - input.engine_root
    when:
      equals:
        field: input.venv_python_exists
        value: true
    with:
      package: launchcraft-fixture
      stage: remove
  - id: remove_venv_tree
    uses: fs.remove_tree
    requires:
    - input.venv_path
    - input.retire_references
    with:
      path_from: input.venv_path
      retire_references_from: input.retire_references
  - id: forget_install
    uses: publish.forget
    requires:
    - input.version_name
