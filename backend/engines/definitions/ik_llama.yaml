# AUTHORITATIVE engine definition (hand-authored; NOT exported).
#
# ik_llama.cpp is definition-owned: identity, the native source-build recipe,
# build-option catalog and catalogue policy live here. Native GGUF launch stays
# the legacy family compiler (recorded departure).
schema_version: 2
id: ik_llama
extends:
- text_generation_tasks
- gguf_llama_server
label: ik_llama.cpp
ui_kind: native
repository_source: ik_llama.cpp
native_host: cmake_source
install_kind: cmake
discovery:
  # Native invocation/LD-path resolution is a shared llama-family mechanism.
  mode: adapter
recipes:
  source:
  - id: prepare_checkout
    uses: vcs.workspace_checkout
    produces:
    - checkout
  - id: apply_patches
    uses: vcs.apply_patch
    requires:
    - checkout
    when:
      exists:
        field: input.patches
    produces:
    - patched
  - id: configure
    uses: cmake.configure
    requires:
    - checkout
    produces:
    - build_dir
  - id: compile
    uses: cmake.build
    requires:
    - build_dir
    produces:
    - compiled
  - id: locate_binary
    uses: artifact.locate
    requires:
    - compiled
    produces:
    - server_path
  - id: finalize
    uses: publish.finalize
    requires:
    - server_path
    produces:
    - binary
  remove_version:
  - id: remove_install_dir
    uses: fs.remove_tree
    requires:
    - input.delete_target
    - input.retire_references
    with:
      path_from: input.delete_target
      retire_references_from: input.retire_references
  - id: remove_binary_file
    uses: fs.remove_file
    requires:
    - input.file_target
    - input.retire_references
    when:
      exists:
        field: input.file_target
    with:
      path_from: input.file_target
      release_hold_from: input.retire_references
      optional: true
  - id: forget_row
    uses: publish.forget
    requires:
    - input.registered
    - input.version_name
runtime_profiles:
  default:
    default: true
    description: llama-server GGUF (native family)
    launch_family: gguf_llama_server
    port_binding:
      flag: --port
    env:
      # Native builds cache objects with Studio's ccache; the CUDA driver
      # still JIT-compiles any PTX the binary carries and otherwise writes
      # into $HOME/.nv. Keep that compute cache beside the install.
      caches:
      - XDG_CACHE_HOME
      - CUDA_CACHE_PATH
    launch_args:
      model: --model
      hf_repo: --hf-repo
      alias: --alias
      mmproj: --mmproj
      draft: --model-draft
      spec_type: --spec-type
source_build:
  repository_name: ik_llama.cpp
  source_dir: llama.cpp
  binary_name: llama-server
  build_examples_required: true
  stable_release_versions: false
  blas_supported: false
launch_policy:
  runtime_context_key: ctx_size
  capcompat: true
build_options:
  build_types:
  - Debug
  - Release
  - RelWithDebInfo
  - MinSizeRel
  build_type_default: Release
  primary_keys:
  - blas
  - cuda
  categories:
  - id: backends
    label: GPU & compute backends
    collapsed: false
  - id: iqk
    label: IQK optimizations (ik_llama)
    collapsed: true
    engines:
    - ik_llama
  - id: cuda
    label: CUDA options
    collapsed: true
  - id: cpu_accel
    label: CPU / BLAS acceleration
    collapsed: true
  - id: artifacts
    label: Build artifacts
    collapsed: true
  - id: ggml
    label: GGML general
    collapsed: true
  - id: cpu_isa
    label: CPU instruction sets
    collapsed: true
  - id: debug
