# AUTHORITATIVE engine definition (hand-authored; NOT exported).
#
# Upstream SGLang converted to definition-owned configuration. The definition
# supplies identity, recipes, lifecycle, launch profile (including the
# llm/diffusion runtime switch) and the discovery probes; the remaining Python
# class only owns the shared install-log streaming and status payload until
# those mechanisms are declared.
schema_version: 2
id: sglang
extends:
- text_generation_tasks
- python_venv_safetensors
label: SGLang
repository_source: SGLang
runtime_kind: sglang
scanner_kind: sglang_help
input_modalities:
- image
- text
- video
output_modalities:
- embedding
- score
- text
supports_embeddings: true
recipes:
  release:
  - id: resolve_version
    uses: prereqs.resolve_version
    with:
      channel: pypi
      package: sglang
    produces:
    - version
  - id: create_venv
    uses: venv.create
    requires:
    - input.engine_root
    produces:
    - venv
  - id: install_package
    uses: pip.install_package
    requires:
    - venv
    - version
    - input.force_reinstall
    with:
      package: sglang
      version_from: version
      stage: install
      append: false
      extra_args:
      - --pre
      error: pip install failed with status {code}
  - id: capture_metadata
    uses: pip.capture_metadata
    requires:
    - venv
    produces:
    - metadata
  - id: finalize
    uses: publish.finalize
    requires:
    - venv
  source:
  - id: cuda_env
    uses: env.compose
    requires:
    - input.engine_root
    produces:
    - build_env
    - runtime_meta
  - id: checkout
    uses: vcs.workspace_checkout
    requires:
    - input.repo_url
    - input.branch
    - input.reuse_mode
    produces:
    - checkout
  - id: bootstrap_pip
    uses: pip.install_package
    requires:
    - checkout
    with:
      package: pip
      stage: install_source
      append: true
      error: pip upgrade failed with status {code}
  - id: assert_checkout
    uses: fs.assert_dir
    requires:
    - checkout
    with:
      path_from: checkout
      subpath: python
      error: SGLang source package directory is unavailable
  - id: install_checkout
    uses: pip.install_package
    requires:
    - checkout
    - build_env
    with:
      editable: true
      package_from: checkout
      subpath: python
      cwd_from: checkout
      env_from: build_env
      env_ccache: true
      stage: install_source
      error: SGLang source install failed with status {code}
  - id: seal_checkout
    uses: vcs.seal_checkout
    requires:
    - checkout
    with:
      destination: source
      workspace_from: workspace
  - id: capture_commit
    uses: vcs.capture_commit
    requires:
    - checkout
    produces:
    - source_commit
    with:
      path_from: checkout
  - id: finalize
    uses: publish.finalize
    requires:
    - checkout
    - source_commit
    - runtime_meta
  sync:
  - id: cuda_env
    uses: env.compose
    requires:
    - input.engine_root
    produces:
    - build_env
    - runtime_meta
  - id: sync_checkout
    uses: vcs.sync
    requires:
    - input.branch
    produces:
    - checkout
  - id: bootstrap_pip
    uses: pip.install_package
    requires:
    - checkout
    with:
      package: pip
      stage: install_source
      append: true
      error: pip upgrade failed with status {code}
  - id: assert_checkout
    uses: fs.assert_dir
    requires:
    - checkout
    with:
      path_from: checkout
      subpath: python
      error: SGLang source package directory is unavailable
  - id: install_checkout
    uses: pip.install_package
    requires:
    - checkout
    - build_env
    with:
      editable: true
      package_from: checkout
      subpath: python
      cwd_from: checkout
      env_from: build_env
      env_ccache: true
      stage: install_source
      error: SGLang source install failed with status {code}
  - id: capture_commit
    uses: vcs.capture_commit
    requires:
    - checkout
    produces:
    - source_commit
    with:
      path_from: checkout
  - id: finalize
    uses: publish.finalize
    requires:
    - checkout
    - source_commit
    - runtime_meta
  remove:
  - id: remove_install_dir
    uses: fs.remove_tree
    requires:
    - input.install_dir
    - input.installs_root
    - input.retire_references
    with:
      path_from: input.install_dir
      require_parent_from: input.installs_root
      retire_references_from: input.retire_references
  - id: forget
    uses: publish.forget
    requires:
    - input.version_name
  remove_version:
  - id: remove_install_dir
    uses: fs.remove_tree
    requires:
    - input.delete_target
    - input.retire_references
    with:
      path_from: input.delete_target
      retire_references_from: input.retire_references
  - id: forget_row
    uses: publish.forget
    requires:
    - input.registered
    - input.version_name
lifecycle:
  binary_name: python
  distribution_names:
  - sglang
  root_name: sglang
  log_name: sglang_install.log
  default_repo_url: https://github.com/sgl-project/sglang.git
  default_branch: main
  version_setting_key: pip_version
  update_source:
    kind: pypi
    package: sglang
  status_fallback:
    installed_at: null
    removed_at: null
    log_path: null
  # Status projection (replaces the former per-engine status override).
  status:
    binary: venv_python
    include_engine: true
    include_removed_at: false
    row_fields:
    - source_commit
    - cuda_version
    - cuda_path
    - python_version
    constants:
      v100: false
  source_started_message: '{label} source installation started'
  # Streaming install log (replaces the per-engine log mixin).
  log:
    heartbeat_seconds: 45
    progress_milestones:
    - contains: 'collecting '
      progress: 15
      message: Resolving {label} dependencies
    - contains: 'downloading '
      progress: 25
      message: Downloading {label} dependencies
    - contains: 'building editable'
      progress: 55
      message: Building {label}
    - contains: 'installing collected packages'
      progress: 75
      message: Installing {label}
    - contains: 'successfully installed'
      progress: 92
      message: Validating {label}
discovery:
  parser: sglang_help
  primary_runtime: llm
  cwd: venv_root
  cuda_env: true
  probe_variants:
  - executable:
      kind: venv_python
      name: python
    argv_prefix:
    - -m
    - sglang.launch_server
    - --help
  runtime_probes:
    diffusion:
      parser: sglang_diffusion_help
      argv_prefix:
      - -c
      - from sglang.cli.main import main; main()
      - serve
      - --model-type
      - diffusion
      - --help
      unavailable_marker: Diffusion model support is not available
runtime_profiles:
  default:
    default: true
    description: SGLang launch_server (python -m)
    executable:
      kind: venv_python
      name: python
    argv_prefix:
    - -m
    - sglang.launch_server
    model_binding:
      mode: flag
      flag: --model-path
      source: huggingface_id
    port_binding:
      flag: --port
    env:
      cwd: venv_root
      cuda: true
    runtime_switch:
      config_key: sglang_runtime
      default: llm
      variants:
        diffusion:
          argv_prefix:
          - -c
          - from sglang.cli.main import main; main()
          - serve
          - --model-type
          - diffusion
          scanned_catalog: diffusion
launch_policy:
  cpu_supported: false
  # Upstream SGLang 0.5.23 ships CUDA-13 torch with sm_75+ only.
  # SM70 has the separate SGLang-V100 fork.
  gpu_archs:
  - sm75
  - sm80
  - sm86
  - sm89
  - sm90
  runtime_context_key: context_length
catalog:
  providers:
  - huggingface
upstream:
  repository_url: https://github.com/sgl-project/sglang.git
settings_defaults:
  source_repo: https://github.com/sgl-project/sglang.git
  source_branch: main
  pip_version: ''
data_dirs:
- sglang
