schema_version: 1
name: sglang_v100/pyproject
description: Drop the stock wheel pins the source build replaces, so pip cannot install a PyPI
  FlashInfer/sglang-kernel beside the SM70 builds. Tolerant of upstream pin bumps by design.
file: python/pyproject.toml
marker: '# Studio SM70 dependency overrides applied'
prepend_marker: true
operations:
- kind: replace_all_or_none
  replacements:
  - search: '"flashinfer_python==0.6.12",'
    replace: ''
  - search: '"flashinfer_cubin==0.6.11.post1",'
    replace: ''
  - search: '"sglang-kernel==0.4.3",'
    replace: ''
