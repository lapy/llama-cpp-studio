schema_version: 1
name: sglang_v100/install_v100_studio
description: Rewrite the fork's host bootstrap to consume Studio Python/CUDA, keep the Python toolkit
  on CUDA 12.8, and write the Studio entry point.
file: scripts/install_v100.sh
output: scripts/install_v100_studio.sh
executable: true
operations:
- kind: replace_region
  start: if [[ ${EUID} -eq 0 ]]; then
  end: '# Use every CPU only when RAM can sustain'
  replace: '# Studio owns host packages, Python, and CUDA.

    [[ -n "${SGLANG_STUDIO_PYTHON:-}" ]] || die "SGLANG_STUDIO_PYTHON is required."

    [[ -x "$SGLANG_STUDIO_PYTHON" ]] || die "Studio Python is not executable: $SGLANG_STUDIO_PYTHON"

    [[ -n "${SGLANG_STUDIO_CUDA_HOME:-}" ]] || die "SGLANG_STUDIO_CUDA_HOME is required."

    [[ -x "$SGLANG_STUDIO_CUDA_HOME/bin/nvcc" ]] || die "Studio CUDA nvcc is missing."

    export VIRTUAL_ENV="$(dirname "$(dirname "$SGLANG_STUDIO_PYTHON")")"

    export CUDA_HOME="$SGLANG_STUDIO_CUDA_HOME"

    export CUDA_PATH="$CUDA_HOME"

    export PATH="$(dirname "$SGLANG_STUDIO_PYTHON"):$CUDA_HOME/bin:$PATH"

    export CUDAHOSTCXX="${SGLANG_STUDIO_CUDAHOSTCXX:-${CUDAHOSTCXX:-}}"

    export TORCH_CUDA_ARCH_LIST=7.0

    log "Using Studio Python: $SGLANG_STUDIO_PYTHON"

    log "Using Studio CUDA: $CUDA_HOME"

    # A failed pre-adapter attempt may have populated this versioned venv with

    # CUDA 13 Python-toolkit packages. These are not the NVIDIA driver and are not

    # used with Studio''s managed CUDA 12.8 toolkit.

    python -m pip uninstall -y   cuda-python cuda-bindings cuda-core cuda-pathfinder cuda-toolkit   nvidia-cuda-crt
    nvidia-cuda-nvcc nvidia-cuda-runtime   nvidia-cuda-tileiras nvidia-nvjitlink nvidia-nvvm || true


    '
  skip_if_contains: Studio owns host packages
- kind: replace
  search: python -m pip install --no-deps -r "$REPO_ROOT/requirements.txt"
  replace: "# Studio keeps the Python CUDA toolkit aligned with its managed CUDA 12.8.\nSTUDIO_REQUIREMENTS=\"\
    $REPO_ROOT/.studio-v100-requirements.txt\"\nawk '!/^(cuda-python|cuda-bindings|cuda-core|cuda-pathfinder|cuda-toolkit|nvidia-cuda-crt|nvidia-cuda-nvcc|nvidia-cuda-runtime|nvidia-cuda-tileiras|nvidia-nvjitlink|nvidia-nvvm)([<>=!~]|$)/'\
    \ \\\n  \"$REPO_ROOT/requirements.txt\" > \"$STUDIO_REQUIREMENTS\"\npython -m pip install --no-deps\
    \ -r \"$STUDIO_REQUIREMENTS\"\n# FlashInfer imports CUDA's Python driver bindings at runtime.  The\
    \ source\n# build intentionally uses --no-deps, so restore the bindings explicitly\n# after filtering\
    \ the fork's CUDA 13 packages above.  This does not install a\n# CUDA toolkit; it only installs cuda-python\
    \ and its matching bindings.\npython -m pip install \"cuda-python==12.8.0\""
  optional: true
  skip_if_contains: STUDIO_REQUIREMENTS
- kind: insert_after
  marker: log "Building V100 Marlin GPTQ/AWQ kernels"
  text: '# Do not leak sglang-kernel-only CMake flags into Marlin.

    unset CMAKE_ARGS'
  skip_if_contains: unset CMAKE_ARGS
- kind: replace
  search: git -C "$destination" sparse-checkout set "$@"
  replace: git -C "$destination" sparse-checkout set --no-cone "$@"
  optional: true
  skip_if_contains: sparse-checkout set --no-cone
- kind: replace
  search: LICENSE csrc/core csrc/sm70_turbomind csrc/moe
  replace: LICENSE csrc/core csrc/sm70_turbomind csrc/moe 'csrc/*.h' 'csrc/*.cuh'
  optional: true
  skip_if_contains: csrc/*.cuh
- kind: replace
  search: 'log "Complete. Run: conda activate sglang-v100"'
  replace: 'log "Complete. Studio environment: $VIRTUAL_ENV"'
  optional: true
  skip_if_contains: 'Studio environment: $VIRTUAL_ENV'
