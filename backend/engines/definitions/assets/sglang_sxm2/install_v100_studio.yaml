schema_version: 1
name: sglang_sxm2/install_v100_studio
description: Replace the fork's host bootstrap with Studio's Python/CUDA/Rust environment and write the
  Studio entry point. Everything else - requirements.txt, source builds, smoke check - stays exactly as
  the maintainer ships it.
file: scripts/install_v100.sh
output: scripts/install_v100_studio.sh
executable: true
operations:
- kind: replace_region
  start: if [[ ${EUID} -eq 0 ]]; then
  end: '# Use every CPU only when RAM can sustain'
  replace: |
    # Studio owns host packages, Python, CUDA and Rust.
    [[ -n "${SGLANG_STUDIO_PYTHON:-}" ]] || die "SGLANG_STUDIO_PYTHON is required."
    [[ -x "$SGLANG_STUDIO_PYTHON" ]] || die "Studio Python is not executable: $SGLANG_STUDIO_PYTHON"
    [[ -n "${SGLANG_STUDIO_CUDA_HOME:-}" ]] || die "SGLANG_STUDIO_CUDA_HOME is required."
    [[ -x "$SGLANG_STUDIO_CUDA_HOME/bin/nvcc" ]] || die "Studio CUDA nvcc is missing."
    export VIRTUAL_ENV="$(dirname "$(dirname "$SGLANG_STUDIO_PYTHON")")"
    export CUDA_HOME="$SGLANG_STUDIO_CUDA_HOME"
    export CUDA_PATH="$CUDA_HOME"
    export PATH="$(dirname "$SGLANG_STUDIO_PYTHON"):$CUDA_HOME/bin:$PATH"
    export CUDAHOSTCXX="${SGLANG_STUDIO_CUDAHOSTCXX:-${CUDAHOSTCXX:-}}"
    export TORCH_CUDA_ARCH_LIST=7.0
    # The serve scripts export CC/CXX/CUDAHOSTCXX/NVCC_PREPEND_FLAGS because the
    # runtime JIT invokes a bare `nvcc`; the build needs the same pinning.
    if [[ -n "${CUDAHOSTCXX:-}" ]]; then
      export NVCC_PREPEND_FLAGS="${NVCC_PREPEND_FLAGS:--ccbin $CUDAHOSTCXX}"
      export CXX="${CXX:-$CUDAHOSTCXX}"
    fi
    log "Using Studio Python: $SGLANG_STUDIO_PYTHON"
    log "Using Studio CUDA: $CUDA_HOME"
  skip_if_contains: Studio owns host packages
- kind: insert_after
  marker: log "Building V100 Marlin GPTQ/AWQ kernels"
  text: |
    # Do not leak sglang-kernel-only CMake flags into Marlin.
    unset CMAKE_ARGS
  skip_if_contains: unset CMAKE_ARGS
- kind: replace
  search: 'log "Complete. Run: conda activate sglang-v100"'
  replace: 'log "Complete. Studio environment: $VIRTUAL_ENV"'
  optional: true
  skip_if_contains: 'Studio environment: $VIRTUAL_ENV'
# The TurboMind gemm sources include headers that sit at the ROOT of csrc/
# (cub_helpers.h, custom_all_reduce.cuh, sm70_tile_runtime_signal.cuh). A
# narrow fork-side subset (csrc/core, csrc/sm70_turbomind, csrc/moe) omits
# them whenever the dependency checkout ends up in pattern (non-cone) mode,
# and nvcc only fails an hour later on
#   epilogue.h: fatal error: ../../../../../../sm70_tile_runtime_signal.cuh
# Guarantee the post-condition instead of rewriting the fork's path list. The
# list is fork-owned data and drifts: dg1kjd/sglang-sxm2#5 widened it from the
# narrow subset above to `LICENSE csrc`, which used to make this asset
# inapplicable and block the whole install. `sparse-checkout add csrc` is
# recursive in both cone and pattern mode, and a no-op once the fork already
# checks out the whole tree, so the guard survives any future list.
- kind: insert_after
  marker: git -C "$destination" sparse-checkout set "$@"
  text: |-
    # Studio: always materialize the whole csrc tree. TurboMind's gemm sources
    # include headers at its ROOT, which a narrower fork-side subset drops in
    # pattern (non-cone) mode. Adding the directory is recursive in both modes
    # and is a no-op when the fork already checks out all of csrc.
    if git -C "$destination" cat-file -e HEAD:csrc 2>/dev/null; then
      git -C "$destination" sparse-checkout add csrc
    fi
  skip_if_contains: sparse-checkout add csrc
